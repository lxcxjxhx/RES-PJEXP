name: Translate README to English

on:
  push:
    branches: [main]
    paths: ['README.md']
  schedule:
    # 每天 00:30 UTC 运行（在 update_all 自动生成 README 之后兜底同步英文版）
    - cron: '30 0 * * *'
  workflow_dispatch:  # 支持手动触发

# 首次使用前，请在仓库添加一个 Actions secret：
#   Settings -> Secrets and variables -> Actions -> New repository secret
#   Name:  DEEPSEEK_API_KEY
#   Value: 你的 DeepSeek API Key（https://platform.deepseek.com）
# 可选 secret：DEEPSEEK_BASE_URL（默认 https://api.deepseek.com）、
#             DEEPSEEK_MODEL（默认 deepseek-chat）
# 未配置 DEEPSEEK_API_KEY 时，本任务会自动跳过。

permissions:
  contents: write

concurrency:
  group: translate-readme
  cancel-in-progress: true

jobs:
  translate:
    runs-on: ubuntu-latest
    if: ${{ secrets.DEEPSEEK_API_KEY != '' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Translate README.md to README.en.md
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_BASE_URL: ${{ secrets.DEEPSEEK_BASE_URL }}
          DEEPSEEK_MODEL: ${{ secrets.DEEPSEEK_MODEL }}
        run: python .github/scripts/translate_readme.py

      - name: Commit and push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.en.md

          if git diff --staged --quiet; then
            echo "README.en.md is up to date - nothing to commit."
          else
            echo "Committing updated English README..."
            git commit -m "Auto-translate README to English (README.en.md)

            Generated from README.md by .github/scripts/translate_readme.py
            using the DeepSeek API."
            git push
            echo "✓ Changes pushed successfully"
          fi
